<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>安いガソリンスタンド地図 | 全国ランキング</title>
    <meta
      name="description"
      content="gogo.gs の全国ガソリン価格ランキング上位のスタンドを衛星写真の地図上に表示します。"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <div id="map"></div>

    <button id="panel-toggle" class="panel-toggle" type="button" aria-controls="panel">
      <span aria-hidden="true">☰</span> 絞り込み
    </button>

    <aside id="panel" class="panel" aria-label="絞り込みと一覧">
      <header class="panel__header">
        <div>
          <h1 class="panel__title">安いガソリンスタンド地図</h1>
          <p class="panel__meta" id="meta">読み込み中…</p>
        </div>
        <button id="panel-close" class="panel__close" type="button" aria-label="パネルを閉じる">
          ×
        </button>
      </header>

      <div class="panel__body">
        <section class="field">
          <h2 class="field__label">油種</h2>
          <div class="segmented" id="fuel" role="radiogroup" aria-label="油種"></div>
        </section>

        <section class="field">
          <h2 class="field__label">価格の種類</h2>
          <div class="segmented" id="price-type" role="radiogroup" aria-label="価格の種類">
            <button type="button" role="radio" data-value="best" aria-checked="true">安い方</button>
            <button type="button" role="radio" data-value="normal" aria-checked="false">現金</button>
            <button type="button" role="radio" data-value="member" aria-checked="false">会員</button>
          </div>
        </section>

        <section class="field field--row">
          <label class="field__inline">
            <span class="field__label">都道府県</span>
            <select id="pref"></select>
          </label>
          <label class="field__inline">
            <span class="field__label">更新</span>
            <select id="freshness">
              <option value="0">すべて</option>
              <option value="1">24時間以内</option>
              <option value="3">3日以内</option>
              <option value="7">7日以内</option>
            </select>
          </label>
        </section>

        <section class="field">
          <label class="field__label" for="search">店名・住所で検索</label>
          <input id="search" type="search" placeholder="例: セルフ 八王子" autocomplete="off" />
        </section>

        <section class="field">
          <h2 class="field__label">
            ブランド
            <button type="button" class="link-btn" id="brand-reset">すべて</button>
          </h2>
          <div class="chips" id="brands"></div>
        </section>

        <section class="field">
          <h2 class="field__label">価格の目安</h2>
          <div class="legend" id="legend"></div>
        </section>

        <section class="field field--grow">
          <h2 class="field__label">安い順 <span class="count" id="count"></span></h2>
          <ol class="list" id="list"></ol>
        </section>
      </div>

      <footer class="panel__footer">
        価格データ:
        <a href="https://gogo.gs/" target="_blank" rel="noopener">gogo.gs</a> ／ 各都道府県の上位<span
          id="topn"
          >-</span
        >位
      </footer>
    </aside>

    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
